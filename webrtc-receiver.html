<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC 受信(PC / OBS側)</title>
<style>
  :root{
    --bg-deep:#0b0d10; --panel:#15181c; --border:#282e35;
    --text:#e9e7e2; --text-dim:#7c838c; --amber:#f0a83c; --tally-red:#e6293b;
    --mono:'SFMono-Regular','IBM Plex Mono','Consolas','Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg-deep);color:var(--text);font-family:var(--sans);}
  body{padding:20px 16px 40px;max-width:520px;margin:0 auto;}
  h1{font-family:var(--mono);font-size:14px;letter-spacing:.14em;color:var(--amber);margin:0 0 4px;}
  video{
    width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;
    border:1px solid var(--border);object-fit:cover;margin-top:14px;
  }
  label{
    display:block;font-family:var(--mono);font-size:11px;color:var(--text-dim);
    letter-spacing:.05em;margin:16px 0 6px;
  }
  textarea{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-family:var(--mono);font-size:11px;border-radius:5px;padding:8px;resize:vertical;
  }
  button{
    font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.04em;
    padding:10px 16px;border-radius:5px;border:1px solid var(--tally-red);
    background:var(--tally-red);color:#fff;cursor:pointer;margin-top:10px;margin-right:6px;
  }
  button.secondary{background:var(--panel);border-color:var(--border);color:var(--text);}
  #status{
    font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:12px;line-height:1.6;
  }
  #status.error{color:var(--tally-red);}
  #status.ok{color:var(--amber);}
</style>
</head>
<body>
  <h1>WebRTC 受信(PC / OBS側)</h1>

  <label>①スマホからもらったコードを貼り付け</label>
  <textarea id="offerIn" rows="4" placeholder="スマホ側で生成されたコードを貼り付け"></textarea>
  <button id="answerBtn" type="button">② 応答を作成</button>

  <label>③スマホへ渡すコード</label>
  <textarea id="answerOut" rows="4" readonly placeholder="「応答を作成」を押すと生成されます"></textarea>
  <button id="copyAnswerBtn" type="button" class="secondary">コピー</button>

  <video id="video" autoplay playsinline></video>

  <div id="status">スマホ側で先にカメラを開始し、コードを受け取ってから①に貼り付けてください。</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  let pc = null;

  function setStatus(text, kind){
    statusEl.textContent = text;
    statusEl.classList.remove('error', 'ok');
    if(kind) statusEl.classList.add(kind);
  }

  function waitIceComplete(peer){
    return new Promise(resolve => {
      if(peer.iceGatheringState === 'complete'){ resolve(); return; }
      function check(){
        if(peer.iceGatheringState === 'complete'){
          peer.removeEventListener('icegatheringstatechange', check);
          resolve();
        }
      }
      peer.addEventListener('icegatheringstatechange', check);
    });
  }

  function bufToBase64(buf){
    const bytes = new Uint8Array(buf);
    let bin = '';
    const chunk = 0x8000;
    for(let i = 0; i < bytes.length; i += chunk){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function base64ToBuf(b64){
    b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
    while(b64.length % 4) b64 += '=';
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  async function encodeDescription(desc){
    const json = JSON.stringify(desc);
    if(window.CompressionStream){
      const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf = await new Response(stream).arrayBuffer();
      return 'gz:' + bufToBase64(buf);
    }
    return 'b64:' + bufToBase64(new TextEncoder().encode(json));
  }

  async function decodeDescription(text){
    text = text.trim();
    if(text.startsWith('gz:')){
      const stream = new Blob([base64ToBuf(text.slice(3))]).stream().pipeThrough(new DecompressionStream('gzip'));
      const json = await new Response(stream).text();
      return JSON.parse(json);
    }
    if(text.startsWith('b64:')){
      const json = new TextDecoder().decode(base64ToBuf(text.slice(4)));
      return JSON.parse(json);
    }
    return JSON.parse(text); // backward compatibility: plain JSON pasted directly
  }

  $('answerBtn').addEventListener('click', async () => {
    try{
      const offer = await decodeDescription($('offerIn').value);

      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      pc.ontrack = (e) => {
        $('video').srcObject = e.streams[0];
        setStatus('映像を受信しました。このページをOBSのブラウザソースとして追加してください。', 'ok');
      };

      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      setStatus('応答を作成しています…');
      await waitIceComplete(pc);

      $('answerOut').value = await encodeDescription(pc.localDescription);
      setStatus('③のコード('+ $('answerOut').value.length +'文字)をコピーしてスマホ側に渡してください。');
    }catch(err){
      setStatus('コードの読み込みに失敗しました。スマホ側のコードをそのまま貼り付けてください。(' + err.message + ')', 'error');
    }
  });

  $('copyAnswerBtn').addEventListener('click', async () => {
    const ta = $('answerOut');
    ta.select();
    try{ await navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); }
    setStatus('コピーしました。スマホ側に貼り付けてもらってください。');
  });
})();
</script>
</body>
</html>
